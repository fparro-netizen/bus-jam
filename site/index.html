<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <button id="btn-menu" class="hbtn" aria-label="Levels">&#9776;</button>
  <div id="hud-mid">
    <div id="hud-level">Level 1</div>
    <div id="hud-sub"><span id="hud-moves">Moves 0</span> &middot; <span id="hud-people">0 waiting</span></div>
  </div>
  <button id="btn-sound" class="hbtn" aria-label="Sound">&#128266;</button>
</div>

<div id="hint" class="hidden"></div>
<div id="toast" class="hidden"></div>

<div id="bar" class="hidden">
  <button id="btn-undo" class="tool"><span class="ic">&#8630;</span><span class="lb">Undo</span></button>
  <button id="btn-shuffle" class="tool hero"><span class="ic">&#128256;</span><span class="lb">Shuffle</span><span class="free">FREE</span></button>
  <button id="btn-sort" class="tool"><span class="ic">&#11014;</span><span class="lb">Sort</span><span class="free">FREE</span></button>
  <button id="btn-restart" class="tool"><span class="ic">&#8635;</span><span class="lb">Restart</span></button>
</div>

<div id="stuck" class="panel hidden">
  <div class="ptitle">No moves left</div>
  <div class="ptext">All spots are full and nobody in line fits. Shuffle is free and always makes it solvable again.</div>
  <div class="prow">
    <button id="stuck-shuffle" class="big">&#128256; Shuffle</button>
    <button id="stuck-undo" class="big alt">Undo</button>
    <button id="stuck-restart" class="big alt">Restart</button>
  </div>
</div>

<div id="title" class="screen">
  <div class="logo"><span>BUS</span><span>JAM</span></div>
  <div class="tag">Clear the jam. Fill the buses.</div>
  <button id="btn-play" class="big">Play</button>
  <button id="btn-levels" class="big alt">Levels</button>
  <div class="foot">All 8 parking spots open &middot; Free shuffle, sort &amp; undo &middot; No ads</div>
</div>

<div id="levels" class="screen hidden">
  <div class="shead"><button id="lv-back" class="hbtn" aria-label="Back">&#8592;</button><div class="stitle">Levels</div><div class="stars-total" id="stars-total"></div></div>
  <div id="lv-grid"></div>
</div>

<div id="win" class="screen dim hidden">
  <div class="card">
    <div class="ctitle">Lot cleared!</div>
    <div id="win-stars" class="wstars"></div>
    <div id="win-text" class="ctext"></div>
    <button id="win-next" class="big">Next level</button>
    <div class="prow"><button id="win-replay" class="big alt">Replay</button><button id="win-levels" class="big alt">Levels</button></div>
  </div>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
